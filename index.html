<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANSS — Dashboard Profiling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,650&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --g:#075428;--g2:#13804a;--g3:#38a169;--mint:#e9f6ef;--mint2:#f5faf7;
 --coral:#e4776d;--rose:#dc7fa0;--orange:#e6a04b;--blue:#4e8fc7;--teal:#2c9c95;
 --violet:#8a75c9;--mustard:#c7a23c;--sand:#f6f3ef;--ink:#1e2c24;--muted:#718078;
 --card:#fff;--line:#e4ebe6;--shadow:0 13px 34px rgba(9,71,37,.09);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(180deg,#074a22,#0b5a2a 65%,#0e6430);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:7px 7px 17px;border-bottom:1px solid rgba(255,255,255,.17);margin-bottom:15px;min-height:82px;display:flex;align-items:center}
.agency-logo{width:100%;max-width:190px;height:62px;object-fit:contain;object-position:left center;filter:brightness(0) invert(1)}
.logo .title{font-size:19px;font-weight:800;letter-spacing:.3px}
.logo .sub{font-size:9px;opacity:.78;margin-top:5px;letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{border:0;background:transparent;color:#fff;padding:10px;border-radius:13px;display:flex;gap:9px;align-items:flex-start;text-align:left;cursor:pointer;font-size:11px;line-height:1.35}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.14)}
.nav .num{width:27px;height:27px;border-radius:9px;background:rgba(255,255,255,.13);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.main{min-width:0}
.topbar{height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.topbar .name{font-weight:800;color:var(--g);font-size:16px}
.topbar .meta{font-size:10px;color:var(--muted);text-align:right}
.content{padding:18px}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;background:linear-gradient(135deg,#ffffff,#f5fbf7);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.hero h2{margin:0;color:var(--g);font-size:22px}
.hero p{margin:6px 0 0;font-size:11px;color:var(--muted)}
.hero .pill{padding:7px 11px;background:var(--mint);color:var(--g);font-size:10px;font-weight:700;border-radius:999px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--g2),var(--coral))}
.kpi:after{content:"";position:absolute;right:-18px;top:-18px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--mint),#fcebea)}
.kpi .label{font-size:10px;color:var(--muted);position:relative;z-index:1}
.kpi .value{font-size:25px;font-weight:800;color:var(--g);margin-top:5px;position:relative;z-index:1}
.kpi .sub{font-size:10px;color:var(--muted);margin-top:4px;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card h3{margin:0 0 4px;color:var(--g);font-size:13px}
.card .hint{font-size:9px;color:var(--muted);margin-bottom:10px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:1/-1}
.chart{height:285px;position:relative}.chart.tall{height:385px}.chart.short{height:220px}
.tablewrap{overflow:auto;max-height:390px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:10px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:#f4f8f5;color:var(--g);position:sticky;top:0;z-index:1}
footer{padding:14px 20px;text-align:right;font-size:9px;color:#818a83}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(3,1fr)}.s4,.s5,.s6,.s7,.s8{grid-column:span 6}}
@media(max-width:1000px){.app{grid-template-columns:190px minmax(0,1fr)}.s4,.s5,.s6,.s7,.s8{grid-column:1/-1}}
@media(max-width:760px){.app{display:block}.sidebar{position:relative;height:auto}.nav{display:grid;grid-template-columns:1fr 1fr}.topbar{position:relative}.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.nav{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.content{padding:10px}}
</style>

.anss-head-left,.anss-head-right{display:flex;align-items:center;height:100%;}

}
.hero{

}

}

footer{

@media(max-width:900px){
  .app{grid-template-columns:1fr!important;grid-template-rows:108px auto 70px!important;}
  .sidebar{position:relative!important;top:0!important;height:auto!important;grid-column:1!important;grid-row:2!important;border-right:0!important;border-bottom:1px solid var(--anss-line)!important;}

</style>


<style id="interpretation-ticker-style">
.interpret-strip{
  position:relative;
  overflow:hidden;
  margin:0 0 14px;
  border-radius:12px;
  background:linear-gradient(90deg,#0e5a2c 0%,#126f39 45%,#0e5a2c 100%);
  color:#fff;
  box-shadow:0 8px 20px rgba(12,73,38,.14);
  border:1px solid rgba(255,255,255,.08);
}
.interpret-strip:before{
  content:"INTERPRÉTATION";
  position:absolute;
  left:0;top:0;bottom:0;
  z-index:2;
  display:flex;
  align-items:center;
  padding:0 16px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.8px;
  background:#0b4f27;
  box-shadow:8px 0 18px rgba(0,0,0,.12);
}
.interpret-track{
  display:inline-flex;
  align-items:center;
  gap:34px;
  min-width:max-content;
  padding:11px 20px 11px 150px;
  animation:interpret-scroll 52s linear infinite;
  will-change:transform;
}
.interpret-strip:hover .interpret-track{animation-play-state:paused}
.interpret-item{
  display:inline-flex;
  align-items:center;
  gap:9px;
  font-size:11px;
  white-space:nowrap;
  opacity:.98;
}
.interpret-dot{
  width:7px;height:7px;border-radius:50%;
  background:#f2b2ad;
  box-shadow:0 0 0 4px rgba(242,178,173,.14);
  flex:0 0 auto;
}
@keyframes interpret-scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
@media(max-width:760px){
  .interpret-strip:before{display:none}
  .interpret-track{padding-left:18px;animation-duration:34s}
}
</style>


<style id="page-filter-style">
.page-filters{
  display:flex;flex-wrap:wrap;gap:9px;align-items:end;
  background:#fff;border:1px solid #e0e4e1;border-radius:12px;
  padding:11px 13px;margin:0 0 13px;box-shadow:0 6px 16px rgba(45,55,48,.06)
}
.filter-box{min-width:145px;flex:1 1 145px;max-width:220px}
.filter-box label{display:block;font-size:9px;font-weight:700;color:#607168;margin:0 0 4px}
.filter-box select{
  width:100%;height:34px;border:1px solid #d8e1db;border-radius:8px;
  background:#fff;color:#294234;padding:0 8px;font-size:10px;outline:none
}
.filter-reset{
  height:34px;border:0;border-radius:8px;padding:0 13px;cursor:pointer;
  background:#105b2d;color:#fff;font-size:10px;font-weight:700
}
</style>


<style id="docs-pages-style">
.info-hero{
  background:linear-gradient(135deg,#0d5b2e 0%,#147440 62%,#1c8b52 100%);
  color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px;
  box-shadow:0 10px 26px rgba(13,91,46,.16);position:relative;overflow:hidden
}
.info-hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-78px;background:rgba(255,255,255,.08)}
.info-hero h2{margin:0 0 5px;font-size:20px}
.info-hero p{margin:0;font-size:11px;line-height:1.55;opacity:.93;max-width:950px}
.doc-section-title{font-size:13px;font-weight:800;color:#174b2c;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.doc-section-title:after{content:"";height:1px;background:#dfe7e1;flex:1}
.doc-card{background:#fff;border:1px solid #e3e9e4;border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(48,62,52,.06);margin-bottom:12px}
.criteria-table{width:100%;border-collapse:collapse;font-size:9px}
.criteria-table th{padding:8px;text-align:left;background:#f1f7f3;color:#315441;border-bottom:1px solid #dfe7e1;vertical-align:top}
.criteria-table td{padding:8px;border-bottom:1px solid #edf1ee;vertical-align:top;line-height:1.45}
.criteria-table tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf7f0;color:#16643a;font-size:8px;font-weight:800;margin-right:4px}
.prio-high{color:#b52a2a;font-weight:800}.prio-mid{color:#a06a00;font-weight:800}.prio-low{color:#617068;font-weight:800}
.glossary-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.glossary-card{grid-column:span 6;background:#fff;border-radius:14px;border:1px solid #e3e9e4;padding:14px;box-shadow:0 6px 18px rgba(48,62,52,.06)}
.glossary-card h3{margin:0 0 7px;color:#125d32;font-size:12px}
.glossary-card .definition{font-size:10px;color:#4a5b52;line-height:1.55;margin-bottom:8px}
.formula-box{background:#f7f9f8;border-left:4px solid #176c3c;border-radius:8px;padding:8px 10px;font-size:9px;font-family:Consolas,monospace;color:#29372f;line-height:1.45}
.rule-box{background:#fff7f6;border:1px solid #f3dfdc;border-radius:12px;padding:11px 13px;font-size:9px;line-height:1.6;color:#574943}
@media(max-width:900px){.glossary-card{grid-column:span 12}.criteria-table{font-size:8px}}
</style>


<style id="page3-multiselect-style">
.multi-filter{position:relative;min-width:280px}
.multi-filter summary{
  list-style:none;cursor:pointer;background:#fff;border:1px solid #d9e3dc;border-radius:10px;
  padding:9px 34px 9px 11px;font-size:10px;font-weight:700;color:#294b38;position:relative
}
.multi-filter summary::-webkit-details-marker{display:none}
.multi-filter summary:after{content:"▾";position:absolute;right:11px;top:8px;color:#557060;font-size:12px}
.multi-filter[open] summary{border-color:#1b7744;box-shadow:0 0 0 2px rgba(27,119,68,.08)}
.multi-options{
  position:absolute;z-index:30;top:calc(100% + 5px);left:0;min-width:340px;max-width:430px;
  max-height:310px;overflow:auto;background:#fff;border:1px solid #dce5df;border-radius:12px;
  padding:9px;box-shadow:0 12px 28px rgba(37,62,47,.16)
}
.multi-option{display:flex;align-items:flex-start;gap:8px;padding:7px 6px;border-radius:7px;font-size:9px;color:#3a4e42}
.multi-option:hover{background:#f3f7f4}
.multi-option input{margin-top:1px;accent-color:#176c3c}
.multi-actions{display:flex;gap:7px;padding:6px 5px 9px;border-bottom:1px solid #eef2ef;margin-bottom:4px;position:sticky;top:0;background:#fff;z-index:2}
.multi-actions button{border:0;border-radius:8px;padding:7px 10px;font-size:8px;font-weight:800;cursor:pointer;transition:.18s ease}
.multi-actions button:hover{transform:translateY(-1px);filter:brightness(.98)}
.multi-all{background:#eaf5ee;color:#176c3c}
.multi-none{background:#f2f3f2;color:#58655d}
.multi-ok{margin-left:auto;background:#176c3c!important;color:#fff!important;min-width:58px}
.multi-option input{width:15px;height:15px;flex:0 0 auto}
.multi-option span{line-height:1.4}
.multi-count{background:#176c3c;color:#fff;border-radius:999px;padding:2px 6px;font-size:7px;margin-left:5px}

.p3-filter-wrap{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.p3-filter-wrap .filter-box{min-width:190px}
.selected-levels-note{font-size:8px;color:#718078;margin-top:4px}
</style>

    margin-top:0 !important;

<style id="artistic-layer">
/* ===== Touche artistique — ANSS =====
   Palette et logo d'origine conservés. Cette couche ajoute une identité
   typographique et un fil conducteur visuel autour du thème du "parcours"
   des bénéficiaires, qui est le sujet même du tableau de bord. */
:root{
  --anss-green-deep:#0a4423;
  --anss-gold:#b8923a;
  --anss-gold-soft:#f4e9d3;
  --anss-ink:#1c2b22;
  --anss-paper:#fffdfb;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
}

html,body{font-family:Inter,'Segoe UI',Arial,sans-serif;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}

/* -- Reduced motion respect -- */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* -- Focus visibility -- */
a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{
  outline:2px solid var(--anss-gold)!important;
  outline-offset:2px;
  border-radius:6px;
}

/* -- Sidebar: le "parcours" — fil conducteur reliant les pages ---------- */
.sidebar{padding-top:18px!important}
#nav.nav{position:relative;padding-left:2px}
#nav.nav::before{
  content:"";
  position:absolute;
  left:23px;top:23px;bottom:23px;width:2px;
  background:linear-gradient(to bottom, rgba(16,91,45,.22), rgba(184,146,58,.4));
  z-index:0;
}
#nav.nav button{position:relative;z-index:1;transition:background-color .18s ease,transform .18s ease}
#nav.nav button:hover{transform:translateX(2px)}
#nav.nav .num{
  border-radius:50%!important;
  position:relative;z-index:2;
  box-shadow:0 0 0 4px #fff;
  font-family:var(--serif);
  font-weight:650;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease;
}
#nav.nav button.active .num{
  background:var(--anss-gold)!important;
  color:#fff!important;
  box-shadow:0 0 0 4px #fff,0 0 0 6px rgba(184,146,58,.35);
}
#nav.nav button span:last-child{padding-top:2px}

/* -- Hero : numéro de chapitre en filigrane + relief topographique ------ */
.hero,.info-hero{position:relative;isolation:isolate}
.hero{overflow:hidden}
.hero::after{
  content:attr(data-num);
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-family:var(--serif);
  font-weight:560;
  font-size:104px;
  line-height:1;
  color:var(--anss-green);
  opacity:.06;
  z-index:0;
  pointer-events:none;
  letter-spacing:-.02em;
}
.hero > *{position:relative;z-index:1}
.hero h2,.info-hero h2{
  font-family:var(--serif);
  font-weight:560;
  letter-spacing:-.01em;
}
.info-hero::before{
  content:"";
  position:absolute;right:-40px;top:-40px;width:230px;height:230px;
  background:
    repeating-radial-gradient(circle at 70% 30%, transparent 0 14px, rgba(255,255,255,.05) 14px 15px);
  pointer-events:none;
}

/* -- Entrée de page : un seul mouvement orchestré, pas de fioritures répétées -- */
@keyframes pageReveal{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.hero,.info-hero{animation:pageReveal .5s cubic-bezier(.22,.61,.36,1) both}
.kpis{animation:pageReveal .5s .06s cubic-bezier(.22,.61,.36,1) both}
.grid{animation:pageReveal .5s .1s cubic-bezier(.22,.61,.36,1) both}

/* -- KPI : chiffres éditoriaux, tabulaires, rappel de la ligne du parcours -- */
.kpi .value{
  font-family:var(--serif);
  font-weight:560;
  letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.kpi .label{
  font-weight:600;
  color:var(--anss-ink);
  opacity:.62;
}

/* -- Cartes : fond papier chaud, hiérarchie plus nette ------------------ */
.card,.kpi,.doc-card,.glossary-card{background:var(--anss-paper)!important}
.card h3{
  font-weight:700;
  letter-spacing:0;
}
.formula-box{font-family:'SF Mono',Consolas,monospace}

/* -- Boutons filtre / réinitialiser : accent or plutôt que vert plat ---- */
.filter-reset{
  background:var(--anss-green)!important;
  transition:background-color .18s ease,transform .18s ease;
}
.filter-reset:hover{background:var(--anss-green-deep)!important;transform:translateY(-1px)}
.filter-box select:focus,.multi-filter summary:focus{
  border-color:var(--anss-gold)!important;
  box-shadow:0 0 0 3px rgba(184,146,58,.16)!important;
}

/* -- Bandeau d'interprétation : liseré or au lieu du vert plat ---------- */
.interpret-strip{border-top:2px solid var(--anss-gold)!important}

/* -- Pastilles de priorité, glossaire : léger raffinement --------------- */
.glossary-card h3{font-family:var(--serif);font-weight:560}

@media(max-width:900px){
  .hero::after{font-size:64px;right:10px}
}
</style>

   const den=out.reduce((s,x)=>s+x.nombre,0);
   out.forEach(x=>x.pourcentage=den?x.nombre*100/den:0);
   return out;
 }
 function aggStatusDim(rows,dim,excludeNR=false){
   const m=new Map();
   rows.forEach(x=>{
     if(excludeNR&&isNR(x[dim]))return;
     const key=x.statut+"|||"+x[dim];
     m.set(key,(m.get(key)||0)+Number(x.nombre||0));
   });
   const out=[...m.entries()].map(([key,nombre])=>{

   });
   const den={};
   out.forEach(x=>den[x.statut]=(den[x.statut]||0)+x.nombre);
   out.forEach(x=>x.pourcentage=den[x.statut]?x.nombre*100/den[x.statut]:0);

   (()=>{const x=maxRow(rest,"nombre_beneficiaires");return x?`Parmi les parcours engagés, le statut le plus fréquent est « ${x.statut} » avec ${fmt(x.nombre_beneficiaires)} bénéficiaires.`:""})()
 ])+
 `<div class="kpis">

 `<div class="grid">

 groupedBar("p6all",["Périmètre filtré"],
